---

- hosts: all
  become: true
  pre_tasks:
  - name: Install Updates (Fedora)
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "Fedora"
  
  - name: Install Updates (Ubuntu)
    apt:
      upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

- hosts: lab
  become: true
  tasks:    
  - name: Install Apache and PHP for Fedora servers
    dnf:
      name:
        - httpd
        - php.x86_64
      state: latest
      update_cache: yes
    when: ansible_distribution == "Fedora"

