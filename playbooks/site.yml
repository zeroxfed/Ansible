---

- hosts: all
  become: true
  pre_tasks:
  - name: Update repo cache (Fedora)
    dnf:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Fedora"
  
  - name: Update repo cache (Ubuntu)
    apt:
      update_cache: yes
    changed_when: false
    when: ansible_distribution == "Ubuntu"

- hosts: lab
  become: true
  tasks:    
  - name: Install Apache and PHP for Fedora servers
    dnf:
      name:
        - httpd
        - php.x86_64
      state: latest
      update_cache: yes
    when: ansible_distribution == "Fedora"

