---
- name: Update OpenVPN on Ubuntu
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    # Optional: services to restart after an update.
    # Example: ["openvpn-server@server.service"]
    openvpn_services: []

  pre_tasks:
    - name: Verify the host runs Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: "This playbook requires Ubuntu Linux."

  tasks:
    - name: Update the installed OpenVPN package
      ansible.builtin.apt:
        name: openvpn
        state: latest
        only_upgrade: true
        update_cache: true
        cache_valid_time: 3600
      notify: Restart OpenVPN services

  handlers:
    - name: Restart OpenVPN services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ openvpn_services }}"
