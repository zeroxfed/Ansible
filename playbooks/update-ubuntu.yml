---

# NOTE: THIS CAN RESTART SERVICES AND REBOOT THE MACHINE CAUSING INTERRUPTIONS

# ansible-playbook -i inventory.ini update-ubuntu.yml --check
# ansible-playbook -i inventory.ini update-ubuntu.yml

- name: Update Ubuntu packages
  hosts: ubuntu
  become: true
  gather_facts: true
  serial: 1

  pre_tasks:
    - name: Verify the host runs Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: "This playbook requires Ubuntu Linux."

  tasks:
    - name: Refresh package lists and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        lock_timeout: 300

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required and wait for reconnection
      ansible.builtin.reboot:
        msg: "Rebooting after Ubuntu updates"
        reboot_timeout: 900
      when:
        - reboot_required.stat.exists
        - not ansible_check_mode
